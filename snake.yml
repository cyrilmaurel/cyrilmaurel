# À placer dans : .github/workflows/snake.yml  (dépôt cyrilmaurel/cyrilmaurel)
name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le serpent aux couleurs du portfolio
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00B1AA&color_dots=#1A2547,#0E4F55,#0A7F7B,#00B1AA,#3FD3CC&color_background=#111A33

      - name: Publier sur la branche "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
